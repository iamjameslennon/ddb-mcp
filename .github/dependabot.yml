version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    # Every npm bump so far has been lockfile-only, so five separate PRs all
    # edit the same file: merging one invalidates the other four and forces a
    # rebase plus a full 4-job matrix re-run each. Grouping collapses that into
    # one PR per week. Majors stay ungrouped (anything not matched by a group
    # still gets its own PR) so a breaking change is never buried in a batch.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must track the oldest Node in `engines`, not the newest
      # release. Newer types let tsc accept APIs absent from that runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native Go port and drops the classic JS compiler
      # API (`require("typescript")` exposes only `version`). typescript-eslint
      # is built on that API and peer-caps TS at <6.1.0, so a TS 7 bump fails
      # `npm ci` and breaks lint if forced. Unpin once typescript-eslint
      # supports TS 7 — our own source already typechecks and builds clean on it.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    # Actions are pinned to major tags (actions/checkout@v7), so nearly every
    # bump here is a major — excluding majors the way the npm groups do would
    # leave grouping doing nothing. Batching all of them is safe because these
    # bumps only affect CI itself: a bad one fails the group PR's own checks
    # before it can reach main.
    groups:
      github-actions:
        patterns:
          - "*"
